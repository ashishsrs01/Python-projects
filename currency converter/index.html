<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Currency Converter | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    .converter {
      display: grid;
      gap: 18px;
      max-width: 560px;
      margin: 0 auto;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .field input {
      min-height: 52px;
      font-size: 1rem;
    }

    .result-box {
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 70px;
      display: grid;
      place-content: center;
      text-align: center;
      font-size: 1.05rem;
      color: var(--text);
    }

    .result-box.error {
      color: #fb7185;
    }

    .hint {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    @media (max-width: 620px) {
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="app-page" data-accent="emerald">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Currency Converter</h1>
      <p class="app-subtitle">Convert amounts using live exchange rates in the browser.</p>
    </header>

    <div class="panel converter">
      <div class="field">
        <label for="amount">Amount</label>
        <input id="amount" class="text-input" type="number" min="0" step="any" value="1" />
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="base-currency">Base currency</label>
          <input id="base-currency" class="text-input" type="text" value="USD" maxlength="3" />
        </div>
        <div class="field">
          <label for="target-currency">Target currency</label>
          <input id="target-currency" class="text-input" type="text" value="EUR" maxlength="3" />
        </div>
      </div>

      <button class="btn-primary" id="convert-btn">Convert</button>

      <div class="result-box" id="result-box">Enter values and press Convert.</div>

      <p class="hint">Use ISO codes like <strong>USD</strong>, <strong>EUR</strong>, <strong>INR</strong>, or <strong>JPY</strong>.</p>
    </div>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    const amountInput = document.getElementById('amount');
    const baseInput = document.getElementById('base-currency');
    const targetInput = document.getElementById('target-currency');
    const resultBox = document.getElementById('result-box');
    const convertBtn = document.getElementById('convert-btn');

    function setResult(message, isError = false) {
      resultBox.textContent = message;
      resultBox.classList.toggle('error', isError);
    }

    async function convertCurrency() {
      const amount = parseFloat(amountInput.value);
      const base = baseInput.value.trim().toUpperCase();
      const target = targetInput.value.trim().toUpperCase();

      if (!amount || amount <= 0) {
        setResult('Please enter a valid amount larger than zero.', true);
        return;
      }
      if (!base || !target) {
        setResult('Please enter both base and target currency codes.', true);
        return;
      }
      if (base === target) {
        setResult(`${amount.toLocaleString()} ${base} = ${amount.toLocaleString()} ${target}`);
        return;
      }

      setResult('Converting…');

      try {
        const response = await fetch(`https://api.frankfurter.dev/v2/rate/${base}/${target}`);
        if (!response.ok) {
          throw new Error('Unable to fetch rates. Check the currency codes.');
        }

        const data = await response.json();
        const rate = data.rate;
        if (typeof rate !== 'number') {
          throw new Error('Unexpected response format from the exchange service.');
        }

        const total = amount * rate;
        setResult(`${amount.toLocaleString()} ${base} = ${total.toFixed(2)} ${target} (rate: ${rate.toFixed(4)})`);
      } catch (error) {
        setResult(error.message || 'Network error while fetching rates.', true);
      }
    }

    convertBtn.addEventListener('click', convertCurrency);
    [amountInput, baseInput, targetInput].forEach((input) => {
      input.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') convertCurrency();
      });
    });
  </script>
</body>
</html>
