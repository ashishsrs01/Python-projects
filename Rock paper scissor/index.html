<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rock Paper Scissors | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    .game-container { text-align: center; }

    .scoreboard {
      display: flex; justify-content: center; gap: 16px;
      margin-bottom: 32px;
      animation: fade-up 0.55s ease 0.1s both;
    }

    .score-card {
      flex: 1; max-width: 140px;
      padding: 16px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .score-label {
      font-size: 0.72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted); margin-bottom: 8px;
    }

    .score-value {
      font-size: 2.2rem; font-weight: 700; line-height: 1;
      color: var(--accent);
    }

    .score-card.player .score-value { color: #38bdf8; }
    .score-card.computer .score-value { color: #f472b6; }
    .score-card.tie .score-value { color: #fbbf24; }

    .arena {
      display: flex; align-items: center; justify-content: center; gap: 20px;
      margin-bottom: 28px; min-height: 130px;
      animation: fade-up 0.55s ease 0.14s both;
    }

    .arena-hand {
      width: 100px; height: 100px;
      display: flex; align-items: center; justify-content: center;
      font-size: 3rem;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 20px;
      transition: all 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .arena-hand.shake { animation: shake 0.5s ease; }

    @keyframes shake {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-12px); }
      50% { transform: translateY(4px); }
      75% { transform: translateY(-6px); }
    }

    .arena-hand.win {
      border-color: #34d399;
      box-shadow: 0 0 24px rgba(52, 211, 153, 0.25);
      transform: scale(1.06);
    }

    .arena-hand.lose { opacity: 0.45; transform: scale(0.94); }

    .arena-vs { font-size: 0.85rem; font-weight: 700; color: var(--muted); }

    .result-message {
      font-size: 1.2rem; font-weight: 700;
      margin-bottom: 28px; min-height: 1.6em;
    }

    .result-message.win { color: #34d399; }
    .result-message.lose { color: #f472b6; }
    .result-message.tie { color: #fbbf24; }
    .result-message.waiting { color: var(--muted); font-weight: 500; font-size: 1rem; }

    .choices {
      display: flex; justify-content: center; gap: 14px;
      margin-bottom: 24px;
      animation: fade-up 0.55s ease 0.18s both;
    }

    .choice-btn {
      width: 92px; height: 92px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      font-size: 2.2rem;
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .choice-btn:hover {
      transform: translateY(-4px) scale(1.04);
      border-color: var(--accent);
      box-shadow: 0 10px 28px var(--accent-glow);
    }

    .choice-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .choice-label {
      font-size: 0.62rem; font-weight: 600;
      text-transform: uppercase; color: var(--muted);
    }

    .controls {
      display: flex; justify-content: center; gap: 10px;
      margin-bottom: 28px;
    }

    .history-section {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px;
      animation: fade-up 0.55s ease 0.22s both;
    }

    .history-title {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin-bottom: 12px;
    }

    .history-list {
      max-height: 180px; overflow-y: auto;
      display: flex; flex-direction: column; gap: 6px;
    }

    .history-item {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.03);
      border-radius: 8px;
      font-size: 0.82rem;
      animation: slide-in 0.3s ease;
    }

    @keyframes slide-in {
      from { opacity: 0; transform: translateX(-8px); }
      to { opacity: 1; transform: translateX(0); }
    }

    .history-result.win { color: #34d399; font-weight: 700; }
    .history-result.lose { color: #f472b6; font-weight: 700; }
    .history-result.tie { color: #fbbf24; font-weight: 700; }

    .history-empty { color: var(--muted); padding: 16px; font-size: 0.85rem; }

    @media (max-width: 500px) {
      .arena-hand { width: 76px; height: 76px; font-size: 2.2rem; }
      .choice-btn { width: 76px; height: 76px; font-size: 1.8rem; }
    }
  </style>
</head>
<body class="app-page" data-accent="violet">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Rock Paper Scissors</h1>
      <p class="app-subtitle">Choose your weapon and battle the computer</p>
    </header>

    <div class="game-container">
      <div class="scoreboard">
        <div class="score-card player">
          <div class="score-label">You</div>
          <div class="score-value" id="player-score">0</div>
        </div>
        <div class="score-card tie">
          <div class="score-label">Ties</div>
          <div class="score-value" id="tie-score">0</div>
        </div>
        <div class="score-card computer">
          <div class="score-label">CPU</div>
          <div class="score-value" id="computer-score">0</div>
        </div>
      </div>

      <div class="arena">
        <div class="arena-hand player-hand" id="player-hand">❔</div>
        <div class="arena-vs">VS</div>
        <div class="arena-hand computer-hand" id="computer-hand">❔</div>
      </div>

      <div class="result-message waiting" id="result-message">Pick rock, paper, or scissors to start!</div>

      <div class="choices">
        <button class="choice-btn" onclick="play('rock')" title="Rock">🪨<span class="choice-label">Rock</span></button>
        <button class="choice-btn" onclick="play('paper')" title="Paper">📄<span class="choice-label">Paper</span></button>
        <button class="choice-btn" onclick="play('scissors')" title="Scissors">✂️<span class="choice-label">Scissors</span></button>
      </div>

      <div class="controls">
        <button class="btn-secondary" onclick="resetScores()">Reset Scores</button>
        <button class="btn-secondary" onclick="clearHistory()">Clear History</button>
      </div>

      <div class="history-section">
        <div class="history-title">Round History</div>
        <div class="history-list" id="history-list">
          <div class="history-empty" id="history-empty">No rounds played yet</div>
        </div>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    let playerScore = 0, computerScore = 0, tieScore = 0, roundNumber = 0, isPlaying = false;
    const emojis = { rock: '🪨', paper: '📄', scissors: '✂️' };
    const playerHand = document.getElementById('player-hand');
    const computerHand = document.getElementById('computer-hand');
    const resultMessage = document.getElementById('result-message');
    const historyList = document.getElementById('history-list');
    const historyEmpty = document.getElementById('history-empty');
    const buttons = document.querySelectorAll('.choice-btn');

    function getComputerChoice() {
      const choices = ['rock', 'paper', 'scissors'];
      return choices[Math.floor(Math.random() * 3)];
    }

    function getWinner(userChoice, computerChoice) {
      if (userChoice === computerChoice) return 'tie';
      if (
        (userChoice === 'rock' && computerChoice === 'scissors') ||
        (userChoice === 'paper' && computerChoice === 'rock') ||
        (userChoice === 'scissors' && computerChoice === 'paper')
      ) return 'win';
      return 'lose';
    }

    function play(userChoice) {
      if (isPlaying) return;
      isPlaying = true;
      buttons.forEach(b => b.disabled = true);

      playerHand.textContent = '✊';
      computerHand.textContent = '✊';
      playerHand.classList.add('shake');
      computerHand.classList.add('shake');
      playerHand.classList.remove('win', 'lose');
      computerHand.classList.remove('win', 'lose');
      resultMessage.textContent = '...';
      resultMessage.className = 'result-message waiting';

      setTimeout(() => {
        playerHand.classList.remove('shake');
        computerHand.classList.remove('shake');

        const computerChoice = getComputerChoice();
        const result = getWinner(userChoice, computerChoice);

        playerHand.textContent = emojis[userChoice];
        computerHand.textContent = emojis[computerChoice];
        roundNumber++;

        if (result === 'win') {
          playerScore++;
          resultMessage.textContent = '🎉 You Win!';
          resultMessage.className = 'result-message win';
          playerHand.classList.add('win');
          computerHand.classList.add('lose');
        } else if (result === 'lose') {
          computerScore++;
          resultMessage.textContent = '😢 Computer Wins!';
          resultMessage.className = 'result-message lose';
          computerHand.classList.add('win');
          playerHand.classList.add('lose');
        } else {
          tieScore++;
          resultMessage.textContent = "🤝 It's a Tie!";
          resultMessage.className = 'result-message tie';
        }

        document.getElementById('player-score').textContent = playerScore;
        document.getElementById('computer-score').textContent = computerScore;
        document.getElementById('tie-score').textContent = tieScore;
        addHistory(roundNumber, userChoice, computerChoice, result);

        buttons.forEach(b => b.disabled = false);
        isPlaying = false;
      }, 600);
    }

    function addHistory(round, userChoice, computerChoice, result) {
      historyEmpty.style.display = 'none';
      const item = document.createElement('div');
      item.className = 'history-item';
      item.innerHTML = `
        <span>#${round}</span>
        <span>${emojis[userChoice]} vs ${emojis[computerChoice]}</span>
        <span class="history-result ${result}">${result === 'win' ? 'Won' : result === 'lose' ? 'Lost' : 'Tie'}</span>
      `;
      historyList.insertBefore(item, historyList.firstChild.nextSibling);
      const items = historyList.querySelectorAll('.history-item');
      if (items.length > 20) historyList.removeChild(items[items.length - 1]);
    }

    function resetScores() {
      playerScore = computerScore = tieScore = roundNumber = 0;
      document.getElementById('player-score').textContent = '0';
      document.getElementById('computer-score').textContent = '0';
      document.getElementById('tie-score').textContent = '0';
      playerHand.textContent = '❔';
      computerHand.textContent = '❔';
      playerHand.classList.remove('win', 'lose');
      computerHand.classList.remove('win', 'lose');
      resultMessage.textContent = 'Scores reset! Pick again.';
      resultMessage.className = 'result-message waiting';
      clearHistory();
    }

    function clearHistory() {
      historyList.querySelectorAll('.history-item').forEach(i => i.remove());
      historyEmpty.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === '1' || e.key.toLowerCase() === 'r') play('rock');
      if (e.key === '2' || e.key.toLowerCase() === 'p') play('paper');
      if (e.key === '3' || e.key.toLowerCase() === 's') play('scissors');
    });
  </script>
</body>
</html>
