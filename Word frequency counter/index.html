<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Word Frequency Counter | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    .mode-toggle {
      display: flex; justify-content: center; gap: 4px;
      margin-bottom: 20px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 4px;
      width: fit-content;
      margin-left: auto; margin-right: auto;
    }

    .mode-btn {
      padding: 10px 22px;
      font: inherit;
      font-size: 0.85rem; font-weight: 600;
      color: var(--muted);
      background: transparent;
      border: none; border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
    }

    .mode-btn.active {
      color: var(--bg);
      background: var(--accent);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .letter-input-row {
      display: none;
      align-items: center; gap: 12px;
      margin-bottom: 16px;
      justify-content: center;
    }

    .letter-input-row.visible { display: flex; }

    .letter-input {
      width: 48px;
      padding: 10px;
      font-size: 1.1rem;
      font-weight: 600;
      text-align: center;
      text-transform: lowercase;
    }

    .stats-row {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 12px;
      margin: 20px 0 24px;
    }

    .stat-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      text-align: center;
    }

    .stat-value {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--accent);
      line-height: 1.2;
    }

    .stat-label {
      font-size: 0.7rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.08em;
      color: var(--muted); margin-top: 4px;
    }

    .chart-title {
      font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.12em;
      color: var(--muted); margin-bottom: 16px;
    }

    .chart-bars {
      display: flex; flex-direction: column; gap: 8px;
      max-height: 380px; overflow-y: auto;
    }

    .chart-row {
      display: flex; align-items: center; gap: 12px;
      animation: fade-up 0.35s ease both;
    }

    .chart-label {
      width: 90px;
      text-align: right;
      font-size: 0.82rem; font-weight: 600;
      overflow: hidden; text-overflow: ellipsis;
      white-space: nowrap; flex-shrink: 0;
    }

    .chart-bar-wrapper {
      flex: 1; height: 26px;
      background: rgba(255, 255, 255, 0.04);
      border-radius: 6px; overflow: hidden;
    }

    .chart-bar {
      height: 100%;
      border-radius: 6px;
      background: linear-gradient(90deg, var(--accent2), var(--accent));
      transition: width 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
      min-width: 4px;
      display: flex; align-items: center;
      padding-left: 8px;
    }

    .chart-bar.highlight {
      background: linear-gradient(90deg, #f97316, var(--accent));
    }

    .chart-count {
      font-size: 0.72rem; font-weight: 700;
      color: rgba(7, 11, 20, 0.85);
    }

    .chart-empty {
      text-align: center;
      color: var(--muted);
      padding: 28px;
      font-size: 0.9rem;
    }

    @media (max-width: 500px) {
      .chart-label { width: 64px; font-size: 0.75rem; }
    }
  </style>
</head>
<body class="app-page" data-accent="amber">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell wide">
    <header class="app-header">
      <h1 class="app-title">Word Frequency Counter</h1>
      <p class="app-subtitle">Paste text and analyze word or letter frequencies</p>
    </header>

    <div class="mode-toggle">
      <button class="mode-btn active" id="mode-word" onclick="setMode('word')">Words</button>
      <button class="mode-btn" id="mode-letter" onclick="setMode('letter')">Letters</button>
    </div>

    <div class="letter-input-row" id="letter-input-row">
      <span style="color: var(--muted); font-size: 0.88rem;">Count specific letter:</span>
      <input type="text" class="letter-input text-input" id="letter-input" maxlength="1" placeholder="a" />
    </div>

    <textarea class="text-area" id="text-input" placeholder="Paste or type your text here..."></textarea>

    <div class="stats-row" id="stats-row">
      <div class="stat-card">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total Words</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-unique">0</div>
        <div class="stat-label">Unique</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-most">—</div>
        <div class="stat-label">Most Common</div>
      </div>
      <div class="stat-card">
        <div class="stat-value" id="stat-chars">0</div>
        <div class="stat-label">Characters</div>
      </div>
    </div>

    <div class="panel">
      <div class="chart-title" id="chart-title">Frequency Chart</div>
      <div class="chart-bars" id="chart-bars">
        <div class="chart-empty">Enter some text to see the frequency analysis</div>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    let currentMode = 'word';
    const textInput = document.getElementById('text-input');
    const letterInputRow = document.getElementById('letter-input-row');
    const letterInput = document.getElementById('letter-input');
    const chartBars = document.getElementById('chart-bars');
    const chartTitle = document.getElementById('chart-title');

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('mode-word').classList.toggle('active', mode === 'word');
      document.getElementById('mode-letter').classList.toggle('active', mode === 'letter');
      letterInputRow.classList.toggle('visible', mode === 'letter');
      analyze();
    }

    // Same logic as counter.py — split on whitespace, lowercase words
    function wordCounter(text) {
      const freq = {};
      for (const word of text.split()) {
        const lower = word.toLowerCase();
        freq[lower] = (freq[lower] || 0) + 1;
      }
      return freq;
    }

    function letterCounter(text) {
      const freq = {};
      for (const ch of text.toLowerCase()) {
        if (/[a-z]/.test(ch)) freq[ch] = (freq[ch] || 0) + 1;
      }
      return freq;
    }

    function analyze() {
      const text = textInput.value;

      if (!text.trim()) {
        document.getElementById('stat-total').textContent = '0';
        document.getElementById('stat-unique').textContent = '0';
        document.getElementById('stat-most').textContent = '—';
        document.getElementById('stat-chars').textContent = '0';
        chartBars.innerHTML = '<div class="chart-empty">Enter some text to see the frequency analysis</div>';
        return;
      }

      const words = text.trim().split(/\s+/).filter(w => w.length > 0);
      document.getElementById('stat-chars').textContent = text.length;

      if (currentMode === 'word') {
        const freq = wordCounter(text);
        const entries = Object.entries(freq).sort((a, b) => b[1] - a[1]);
        document.getElementById('stat-total').textContent = words.length;
        document.getElementById('stat-unique').textContent = entries.length;
        const most = entries.length > 0 ? entries[0][0] : '—';
        document.getElementById('stat-most').textContent = most.length > 8 ? most.slice(0, 8) + '…' : most;
        chartTitle.textContent = `Top Words (${entries.length} unique)`;
        renderChart(entries.slice(0, 25));
      } else {
        const specificLetter = letterInput.value.trim().toLowerCase();
        const freq = letterCounter(text);
        const entries = Object.entries(freq).sort((a, b) => b[1] - a[1]);

        if (specificLetter && /^[a-z]$/.test(specificLetter)) {
          const count = freq[specificLetter] || 0;
          document.getElementById('stat-most').textContent = `"${specificLetter}"=${count}`;
          chartTitle.textContent = `Letter "${specificLetter}" appears ${count} time${count !== 1 ? 's' : ''}`;
          renderChart(entries, specificLetter);
        } else {
          document.getElementById('stat-most').textContent = entries.length > 0 ? `"${entries[0][0]}"` : '—';
          chartTitle.textContent = `Letter Frequencies (${entries.length} unique)`;
          renderChart(entries);
        }

        document.getElementById('stat-total').textContent = words.length;
        document.getElementById('stat-unique').textContent = entries.length;
      }
    }

    function renderChart(entries, highlight = null) {
      if (entries.length === 0) {
        chartBars.innerHTML = '<div class="chart-empty">No data to display</div>';
        return;
      }

      const maxCount = entries[0][1];
      chartBars.innerHTML = entries.map(([label, count], i) => {
        const pct = (count / maxCount) * 100;
        const highlightClass = highlight && label === highlight ? ' highlight' : '';
        return `
          <div class="chart-row" style="animation-delay: ${i * 0.03}s">
            <div class="chart-label" title="${label}">${label}</div>
            <div class="chart-bar-wrapper">
              <div class="chart-bar${highlightClass}" style="width: ${Math.max(pct, 3)}%">
                <span class="chart-count">${count}</span>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    textInput.addEventListener('input', analyze);
    letterInput.addEventListener('input', analyze);
    analyze();
  </script>
</body>
</html>
