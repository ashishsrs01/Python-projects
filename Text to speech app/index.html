<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Text to Speech | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    .speaker-viz {
      width: 76px; height: 76px;
      margin: 0 auto 24px;
      border-radius: 50%;
      background: var(--card);
      border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 2rem;
      position: relative;
      animation: fade-up 0.55s ease 0.1s both;
    }

    .speaker-viz.speaking {
      border-color: var(--accent);
      box-shadow: 0 0 32px var(--accent-glow);
      animation: speaker-pulse 1s ease-in-out infinite;
    }

    @keyframes speaker-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    .speaker-viz .wave {
      position: absolute;
      border-radius: 50%;
      border: 2px solid var(--accent);
      opacity: 0;
      animation: wave-expand 1.5s ease-out infinite;
    }

    .speaker-viz.speaking .wave { opacity: 0.35; }

    .wave-1 { width: 100px; height: 100px; }
    .wave-2 { width: 124px; height: 124px; animation-delay: 0.5s; }
    .wave-3 { width: 148px; height: 148px; animation-delay: 1s; }

    @keyframes wave-expand {
      0% { transform: scale(0.85); opacity: 0.5; }
      100% { transform: scale(1.15); opacity: 0; }
    }

    .controls-panel { margin-bottom: 20px; text-align: left; }

    .control-row {
      display: flex; align-items: center; gap: 12px;
      margin-bottom: 16px;
    }

    .control-row:last-child { margin-bottom: 0; }

    .control-label {
      font-size: 0.78rem; font-weight: 600;
      color: var(--muted);
      width: 64px; flex-shrink: 0;
      text-transform: uppercase;
    }

    .control-slider {
      flex: 1;
      accent-color: var(--accent);
      height: 4px;
    }

    .control-value {
      font-size: 0.82rem; font-weight: 600;
      color: var(--accent);
      width: 44px; text-align: right;
    }

    .voice-select {
      flex: 1;
      padding: 10px 12px;
      font: inherit;
      font-size: 0.88rem;
      color: var(--text);
      background: rgba(0, 0, 0, 0.2);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
    }

    .action-buttons {
      display: flex; justify-content: center; gap: 12px;
      margin-bottom: 20px;
    }

    @media (max-width: 500px) {
      .control-row { flex-wrap: wrap; }
      .control-label { width: 100%; }
      .action-buttons { flex-direction: column; }
    }
  </style>
</head>
<body class="app-page" data-accent="rose">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Text to Speech</h1>
      <p class="app-subtitle">Type text and hear it spoken aloud</p>
    </header>

    <div class="speaker-viz" id="speaker-viz">
      🔊
      <div class="wave wave-1"></div>
      <div class="wave wave-2"></div>
      <div class="wave wave-3"></div>
    </div>

    <textarea class="text-area" id="text-input" placeholder="Type or paste the text you want to hear...">Hello! Welcome to the Text to Speech app. This was built by Ashish Sharma as a Python project.</textarea>

    <div class="panel controls-panel">
      <div class="control-row">
        <label class="control-label" for="rate-slider">Speed</label>
        <input type="range" class="control-slider" id="rate-slider" min="0.5" max="2" step="0.1" value="1" />
        <span class="control-value" id="rate-value">1.0x</span>
      </div>
      <div class="control-row">
        <label class="control-label" for="volume-slider">Volume</label>
        <input type="range" class="control-slider" id="volume-slider" min="0" max="1" step="0.1" value="1" />
        <span class="control-value" id="volume-value">100%</span>
      </div>
      <div class="control-row">
        <label class="control-label" for="pitch-slider">Pitch</label>
        <input type="range" class="control-slider" id="pitch-slider" min="0.5" max="2" step="0.1" value="1" />
        <span class="control-value" id="pitch-value">1.0</span>
      </div>
      <div class="control-row">
        <label class="control-label" for="voice-select">Voice</label>
        <select class="voice-select" id="voice-select">
          <option>Loading voices...</option>
        </select>
      </div>
    </div>

    <div class="action-buttons">
      <button class="btn-primary" id="btn-speak" onclick="speakText()">🔊 Speak</button>
      <button class="btn-secondary" id="btn-stop" onclick="stopSpeaking()">⏹ Stop</button>
    </div>

    <p class="note-box">
      <strong>Note:</strong> This web version uses the browser's <code>SpeechSynthesis API</code>.
      The Python version (<code>t-t-s.py</code>) uses <code>pyttsx3</code> which works completely offline.
    </p>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    const synth = window.speechSynthesis;
    const textInput = document.getElementById('text-input');
    const rateSlider = document.getElementById('rate-slider');
    const volumeSlider = document.getElementById('volume-slider');
    const pitchSlider = document.getElementById('pitch-slider');
    const rateValue = document.getElementById('rate-value');
    const volumeValue = document.getElementById('volume-value');
    const pitchValue = document.getElementById('pitch-value');
    const voiceSelect = document.getElementById('voice-select');
    const speakerViz = document.getElementById('speaker-viz');
    const btnSpeak = document.getElementById('btn-speak');

    let voices = [];

    function loadVoices() {
      voices = synth.getVoices();
      voiceSelect.innerHTML = '';

      if (voices.length === 0) {
        voiceSelect.innerHTML = '<option>No voices available</option>';
        return;
      }

      voices.forEach((voice, i) => {
        const option = document.createElement('option');
        option.value = i;
        option.textContent = `${voice.name} (${voice.lang})`;
        if (voice.default) option.selected = true;
        voiceSelect.appendChild(option);
      });
    }

    if (synth.onvoiceschanged !== undefined) synth.onvoiceschanged = loadVoices;
    loadVoices();

    rateSlider.addEventListener('input', () => {
      rateValue.textContent = parseFloat(rateSlider.value).toFixed(1) + 'x';
    });

    volumeSlider.addEventListener('input', () => {
      volumeValue.textContent = Math.round(volumeSlider.value * 100) + '%';
    });

    pitchSlider.addEventListener('input', () => {
      pitchValue.textContent = parseFloat(pitchSlider.value).toFixed(1);
    });

    function resetSpeakButton() {
      speakerViz.classList.remove('speaking');
      btnSpeak.disabled = false;
      btnSpeak.textContent = '🔊 Speak';
    }

    function speakText() {
      const text = textInput.value.trim();
      if (!text) {
        textInput.focus();
        return;
      }

      synth.cancel();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.rate = parseFloat(rateSlider.value);
      utterance.volume = parseFloat(volumeSlider.value);
      utterance.pitch = parseFloat(pitchSlider.value);

      const selectedVoiceIndex = parseInt(voiceSelect.value, 10);
      if (!isNaN(selectedVoiceIndex) && voices[selectedVoiceIndex]) {
        utterance.voice = voices[selectedVoiceIndex];
      }

      utterance.onstart = () => {
        speakerViz.classList.add('speaking');
        btnSpeak.disabled = true;
        btnSpeak.textContent = '🔊 Speaking...';
      };

      utterance.onend = resetSpeakButton;
      utterance.onerror = resetSpeakButton;

      synth.speak(utterance);
    }

    function stopSpeaking() {
      synth.cancel();
      resetSpeakButton();
    }
  </script>
</body>
</html>
