<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Convert units for length, mass, temperature, time, speed, area, volume, energy, pressure, and data storage." />
  <title>Unit Converter | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    .converter {
      display: grid;
      gap: 18px;
      max-width: 700px;
      margin: 0 auto;
    }

    .field-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 0.82rem;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .result-box {
      padding: 18px 20px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      min-height: 80px;
      display: grid;
      place-content: center;
      text-align: center;
      font-size: 1.05rem;
      color: var(--text);
    }

    .result-box.error {
      color: #fb7185;
    }

    .hint {
      color: var(--muted);
      font-size: 0.88rem;
      line-height: 1.6;
    }

    @media (max-width: 620px) {
      .field-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body class="app-page" data-accent="emerald">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Unit Converter</h1>
      <p class="app-subtitle">Convert units across length, mass, temperature, time, speed, area, volume, energy, pressure, and data storage.</p>
    </header>

    <div class="panel converter">
      <div class="field">
        <label for="category">Category</label>
        <select id="category" class="text-input"></select>
      </div>

      <div class="field-grid">
        <div class="field">
          <label for="amount">Value</label>
          <input id="amount" class="text-input" type="number" step="any" value="1" />
        </div>
        <div class="field">
          <label for="from-unit">From unit</label>
          <select id="from-unit" class="text-input"></select>
        </div>
        <div class="field">
          <label for="to-unit">To unit</label>
          <select id="to-unit" class="text-input"></select>
        </div>
      </div>

      <button class="btn-primary" id="convert-btn">Convert</button>

      <div class="result-box" id="result-box">Choose a category and units to convert.</div>
      <p class="hint">Select the category first, then choose units and press Convert.</p>
    </div>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    const categorySelect = document.getElementById('category');
    const amountInput = document.getElementById('amount');
    const fromSelect = document.getElementById('from-unit');
    const toSelect = document.getElementById('to-unit');
    const resultBox = document.getElementById('result-box');
    const convertBtn = document.getElementById('convert-btn');

    const categories = {
      length: {
        label: 'Length / Distance',
        units: {
          mm: 'Millimeter (mm)',
          cm: 'Centimeter (cm)',
          dm: 'Decimeter (dm)',
          m: 'Meter (m)',
          dam: 'Decameter (dam)',
          hm: 'Hectometer (hm)',
          km: 'Kilometer (km)',
          inch: 'Inch (inch)',
          ft: 'Foot (ft)',
          yd: 'Yard (yd)',
          mile: 'Mile (mile)'
        },
        factors: {
          mm: 0.001,
          cm: 0.01,
          dm: 0.1,
          m: 1,
          dam: 10,
          hm: 100,
          km: 1000,
          inch: 0.0254,
          ft: 0.3048,
          yd: 0.9144,
          mile: 1609.34
        }
      },
      mass: {
        label: 'Mass / Weight',
        units: {
          mg: 'Milligram (mg)',
          g: 'Gram (g)',
          kg: 'Kilogram (kg)',
          t: 'Tonne (t)',
          oz: 'Ounce (oz)',
          lb: 'Pound (lb)',
          st: 'Stone (st)',
          us_ton: 'Short Ton (US)',
          imp_ton: 'Long Ton (UK)'
        },
        factors: {
          mg: 0.000001,
          g: 0.001,
          kg: 1,
          t: 1000,
          oz: 0.0283495,
          lb: 0.453592,
          st: 6.35029,
          us_ton: 907.1847,
          imp_ton: 1016.05
        }
      },
      temperature: {
        label: 'Temperature',
        units: {
          celsius: 'Celsius (°C)',
          fahrenheit: 'Fahrenheit (°F)',
          kelvin: 'Kelvin (K)'
        }
      },
      time: {
        label: 'Time',
        units: {
          s: 'Second (s)',
          min: 'Minute (min)',
          h: 'Hour (h)',
          day: 'Day (day)',
          week: 'Week (week)'
        },
        factors: {
          s: 1,
          min: 60,
          h: 3600,
          day: 86400,
          week: 604800
        }
      },
      speed: {
        label: 'Speed',
        units: {
          'm/s': 'Meters per second (m/s)',
          'km/h': 'Kilometers per hour (km/h)',
          mph: 'Miles per hour (mph)',
          knot: 'Knots (knot)'
        },
        factors: {
          'm/s': 1,
          'km/h': 0.277778,
          mph: 0.44704,
          knot: 0.514444
        }
      },
      area: {
        label: 'Area',
        units: {
          'm2': 'Square meter (m²)',
          'cm2': 'Square centimeter (cm²)',
          'km2': 'Square kilometer (km²)',
          'ft2': 'Square foot (ft²)',
          'yd2': 'Square yard (yd²)',
          acre: 'Acre (acre)',
          hectare: 'Hectare (ha)'
        },
        factors: {
          'm2': 1,
          'cm2': 0.0001,
          'km2': 1e6,
          'ft2': 0.092903,
          'yd2': 0.836127,
          acre: 4046.86,
          hectare: 10000
        }
      },
      volume: {
        label: 'Volume',
        units: {
          ml: 'Milliliter (ml)',
          l: 'Liter (l)',
          m3: 'Cubic meter (m³)',
          cm3: 'Cubic centimeter (cm³)',
          gallon: 'Gallon (gal)',
          pint: 'Pint (pt)',
          quart: 'Quart (qt)'
        },
        factors: {
          ml: 0.000001,
          l: 0.001,
          m3: 1,
          cm3: 0.000001,
          gallon: 0.00378541,
          pint: 0.000473176,
          quart: 0.000946353
        }
      },
      energy: {
        label: 'Energy',
        units: {
          j: 'Joule (J)',
          kj: 'Kilojoule (kJ)',
          cal: 'Calorie (cal)',
          kcal: 'Kilocalorie (kcal)',
          wh: 'Watt-hour (Wh)',
          kwh: 'Kilowatt-hour (kWh)'
        },
        factors: {
          j: 1,
          kj: 1000,
          cal: 4.184,
          kcal: 4184,
          wh: 3600,
          kwh: 3.6e6
        }
      },
      pressure: {
        label: 'Pressure',
        units: {
          pa: 'Pascal (Pa)',
          bar: 'Bar (bar)',
          atm: 'Atmosphere (atm)',
          psi: 'Pound per square inch (psi)'
        },
        factors: {
          pa: 1,
          bar: 100000,
          atm: 101325,
          psi: 6894.76
        }
      },
      data: {
        label: 'Data / Storage',
        units: {
          bit: 'Bit (bit)',
          byte: 'Byte (B)',
          kb: 'Kilobyte (KB)',
          mb: 'Megabyte (MB)',
          gb: 'Gigabyte (GB)',
          tb: 'Terabyte (TB)'
        },
        factors: {
          bit: 0.125,
          byte: 1,
          kb: 1024,
          mb: 1024 ** 2,
          gb: 1024 ** 3,
          tb: 1024 ** 4
        }
      }
    };

    const temperatureAlias = {
      celsius: 'c',
      c: 'c',
      fahrenheit: 'f',
      f: 'f',
      kelvin: 'k',
      k: 'k'
    };

    const temperatureFormulas = {
      c: {
        f: (value) => (value * 9) / 5 + 32,
        k: (value) => value + 273.15
      },
      f: {
        c: (value) => (value - 32) * 5 / 9,
        k: (value) => (value - 32) * 5 / 9 + 273.15
      },
      k: {
        c: (value) => value - 273.15,
        f: (value) => (value - 273.15) * 9 / 5 + 32
      }
    };

    function buildCategoryOptions() {
      Object.entries(categories).forEach(([key, category]) => {
        const option = document.createElement('option');
        option.value = key;
        option.textContent = category.label;
        categorySelect.appendChild(option);
      });
    }

    function populateUnitOptions(categoryKey) {
      fromSelect.innerHTML = '';
      toSelect.innerHTML = '';
      const category = categories[categoryKey];
      Object.entries(category.units).forEach(([value, label]) => {
        const optionA = document.createElement('option');
        optionA.value = value;
        optionA.textContent = label;

        const optionB = document.createElement('option');
        optionB.value = value;
        optionB.textContent = label;

        fromSelect.appendChild(optionA);
        toSelect.appendChild(optionB);
      });

      if (fromSelect.options.length > 1) {
        toSelect.selectedIndex = 1;
      }
    }

    function setResult(message, isError = false) {
      resultBox.textContent = message;
      resultBox.classList.toggle('error', isError);
    }

    function convertUnits() {
      const amount = parseFloat(amountInput.value);
      const categoryKey = categorySelect.value;
      const fromUnit = fromSelect.value;
      const toUnit = toSelect.value;

      if (Number.isNaN(amount)) {
        setResult('Enter a valid numeric value.', true);
        return;
      }

      if (!fromUnit || !toUnit) {
        setResult('Choose both units to convert.', true);
        return;
      }

      if (fromUnit === toUnit) {
        setResult(`${amount} ${categories[categoryKey].units[fromUnit]} = ${amount} ${categories[categoryKey].units[toUnit]}`);
        return;
      }

      if (categoryKey === 'temperature') {
        const fromAlias = temperatureAlias[fromUnit];
        const toAlias = temperatureAlias[toUnit];
        if (!fromAlias || !toAlias) {
          setResult('Unsupported temperature units.', true);
          return;
        }
        const result = temperatureFormulas[fromAlias][toAlias](amount);
        setResult(`${amount} ${categories[categoryKey].units[fromUnit]} = ${result.toFixed(2)} ${categories[categoryKey].units[toUnit]}`);
        return;
      }

      const category = categories[categoryKey];
      const factors = category.factors;
      if (!factors || !(fromUnit in factors) || !(toUnit in factors)) {
        setResult('Unsupported unit conversion.', true);
        return;
      }

      const result = amount * factors[fromUnit] / factors[toUnit];
      setResult(`${amount} ${categories[categoryKey].units[fromUnit]} = ${result.toPrecision(10).replace(/(?:\.0+|(?<=\d)0+)$/, '')} ${categories[categoryKey].units[toUnit]}`);
    }

    categorySelect.addEventListener('change', () => {
      populateUnitOptions(categorySelect.value);
      setResult('Choose a category and units to convert.');
    });

    convertBtn.addEventListener('click', convertUnits);
    amountInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        convertUnits();
      }
    });

    buildCategoryOptions();
    categorySelect.value = 'length';
    populateUnitOptions('length');
  </script>
</body>
</html>
