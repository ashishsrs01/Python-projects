<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 500px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .game-info {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }

        .info-item {
            margin: 10px 0;
            color: #555;
            font-size: 0.95em;
        }

        .info-item strong {
            color: #667eea;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }

        input[type="number"] {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1em;
            transition: border-color 0.3s;
        }

        input[type="number"]:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1em;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        .button-group {
            display: flex;
            gap: 10px;
        }

        .btn-secondary {
            background: #e0e0e0;
            color: #333;
            flex: 1;
        }

        .btn-secondary:hover {
            background: #d0d0d0;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.1);
        }

        .message {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-weight: 600;
            display: none;
        }

        .message.show {
            display: block;
        }

        .message.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }

        .message.too-high {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #f5c6cb;
        }

        .message.too-low {
            background: #cce5ff;
            color: #004085;
            border: 2px solid #b8daff;
        }

        .stats {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
        }

        .stat-row {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            color: #555;
        }

        .stat-row strong {
            color: #667eea;
        }

        .game-over {
            text-align: center;
            margin-top: 20px;
        }

        .game-over h2 {
            color: #28a745;
            margin-bottom: 15px;
            font-size: 1.8em;
        }

        @media (max-width: 480px) {
            .container {
                padding: 25px;
            }

            h1 {
                font-size: 2em;
            }

            .input-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 Guess the Number</h1>
        <p class="subtitle">Try to guess the random number!</p>

        <div class="game-info">
            <div class="info-item">Guess a number between <strong>1 and 100</strong></div>
            <div class="info-item">You have <strong id="attemptCount">10</strong> attempts left</div>
        </div>

        <div class="input-group">
            <input type="number" id="guessInput" min="1" max="100" placeholder="Enter your guess...">
            <button onclick="submitGuess()">Guess</button>
        </div>

        <div id="message" class="message"></div>

        <div class="stats" id="statsBox" style="display: none;">
            <div class="stat-row">
                <span>Attempts Made:</span>
                <strong id="attemptsMade">0</strong>
            </div>
            <div class="stat-row">
                <span>Previous Guesses:</span>
                <strong id="previousGuesses">-</strong>
            </div>
        </div>

        <div class="button-group">
            <button class="btn-secondary" onclick="resetGame()">New Game</button>
        </div>

        <div id="gameOver" class="game-over" style="display: none;">
            <h2>🎉 You Won!</h2>
            <p id="winMessage"></p>
        </div>
    </div>

    <script>
        let randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        const maxAttempts = 10;
        let guesses = [];
        let gameOver = false;

        function submitGuess() {
            if (gameOver) return;

            const guessInput = document.getElementById('guessInput');
            const guess = parseInt(guessInput.value);
            const messageDiv = document.getElementById('message');

            if (!guessInput.value || guess < 1 || guess > 100) {
                messageDiv.textContent = '❌ Please enter a valid number between 1 and 100';
                messageDiv.className = 'message show too-high';
                return;
            }

            attempts++;
            guesses.push(guess);
            document.getElementById('attemptsMade').textContent = attempts;
            document.getElementById('previousGuesses').textContent = guesses.join(', ');
            document.getElementById('statsBox').style.display = 'block';

            const attemptsLeft = maxAttempts - attempts;
            document.getElementById('attemptCount').textContent = attemptsLeft;

            if (guess === randomNumber) {
                messageDiv.textContent = `🎉 Correct! The number was ${randomNumber}!`;
                messageDiv.className = 'message show correct';
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('winMessage').textContent = `You guessed it in ${attempts} attempt${attempts !== 1 ? 's' : ''}!`;
                gameOver = true;
            } else if (guess < randomNumber) {
                messageDiv.textContent = `📈 Too low! Try a higher number.`;
                messageDiv.className = 'message show too-low';
            } else {
                messageDiv.textContent = `📉 Too high! Try a lower number.`;
                messageDiv.className = 'message show too-high';
            }

            if (attemptsLeft === 0 && guess !== randomNumber) {
                messageDiv.textContent = `💔 Game Over! The number was ${randomNumber}.`;
                messageDiv.className = 'message show too-high';
                document.getElementById('gameOver').style.display = 'block';
                document.getElementById('gameOver').innerHTML = `<h2>💔 Game Over!</h2><p>The correct number was <strong>${randomNumber}</strong></p>`;
                gameOver = true;
            }

            guessInput.value = '';
            guessInput.focus();
        }

        function resetGame() {
            randomNumber = Math.floor(Math.random() * 100) + 1;
            attempts = 0;
            guesses = [];
            gameOver = false;
            document.getElementById('guessInput').value = '';
            document.getElementById('message').className = 'message';
            document.getElementById('message').textContent = '';
            document.getElementById('statsBox').style.display = 'none';
            document.getElementById('gameOver').style.display = 'none';
            document.getElementById('attemptCount').textContent = maxAttempts;
            document.getElementById('guessInput').focus();
        }

        document.getElementById('guessInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                submitGuess();
            }
        });

        window.onload = function() {
            document.getElementById('guessInput').focus();
        };
    </script>
</body>
</html>
