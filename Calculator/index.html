<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    body.app-page {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .calc {
      width: min(360px, 100%);
      border-radius: 18px;
      border: 1px solid var(--border);
      background: var(--card);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      overflow: hidden;
      animation: fade-up 0.55s ease 0.12s both;
    }

    .screen {
      padding: 20px;
      text-align: right;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .expr {
      min-height: 22px;
      font-size: 0.9rem;
      color: var(--muted);
      word-break: break-all;
    }

    .result {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 6px;
      word-break: break-all;
    }

    .result.error { color: #f87171; }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 14px;
    }

    .keys button {
      padding: 16px 8px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
    }

    .keys button:hover { background: var(--accent-glow); }
    .keys button:active { transform: scale(0.96); }
    .keys button.op { color: var(--accent); }
    .keys button.equals {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      font-weight: 700;
    }

    .history {
      max-height: 100px;
      overflow-y: auto;
      padding: 10px 16px 14px;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .history div { margin-bottom: 4px; }
  </style>
</head>
<body class="app-page" data-accent="cyan">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell narrow">
    <header class="app-header">
      <h1 class="app-title">Calculator</h1>
      <p class="app-subtitle">Add, subtract, multiply, divide, powers, and square roots</p>
    </header>

    <div class="calc">
      <div class="screen">
        <div class="expr" id="expr"></div>
        <div class="result" id="result">0</div>
      </div>
      <div class="keys" id="keys"></div>
      <div class="history" id="history"></div>
    </div>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    let current = "0";
    let expression = "";
    let historyList = [];

    const exprEl = document.getElementById("expr");
    const resultEl = document.getElementById("result");
    const historyEl = document.getElementById("history");
    const keysEl = document.getElementById("keys");

    const buttons = [
      "C", "⌫", "√", "/",
      "7", "8", "9", "*",
      "4", "5", "6", "-",
      "1", "2", "3", "+",
      "0", ".", "^", "=",
    ];

    function updateScreen() {
      exprEl.textContent = expression;
      resultEl.textContent = current;
      resultEl.classList.toggle("error", current === "Error");
    }

    function addToHistory(expr, res) {
      historyList.unshift(expr + " = " + res);
      if (historyList.length > 5) historyList.pop();
      historyEl.innerHTML = historyList.map((line) => "<div>" + line + "</div>").join("");
    }

    function clearAll() {
      current = "0";
      expression = "";
      updateScreen();
    }

    function deleteLast() {
      if (current === "Error") {
        current = "0";
      } else if (current.length <= 1) {
        current = "0";
      } else {
        current = current.slice(0, -1);
      }
      updateScreen();
    }

    function appendValue(val) {
      if (current === "Error") current = "0";
      if (current === "0" && val !== ".") {
        current = val;
      } else if (val === "." && current.includes(".")) {
        return;
      } else {
        current += val;
      }
      updateScreen();
    }

    function setOperator(op) {
      if (current === "Error") return;
      expression = current + " " + op;
      current = "0";
      updateScreen();
    }

    function applySqrt() {
      const num = parseFloat(current);
      if (isNaN(num) || num < 0) {
        current = "Error";
      } else {
        const answer = Math.sqrt(num);
        const rounded = Math.round(answer * 100000000) / 100000000;
        addToHistory("√" + num, rounded);
        current = String(rounded);
      }
      expression = "";
      updateScreen();
    }

    function calculate() {
      if (current === "Error") return;

      try {
        let mathExpr = (expression + current).trim();
        mathExpr = mathExpr.replace(/÷/g, "/").replace(/×/g, "*");

        if (!mathExpr || !/[\d.]/.test(mathExpr)) return;

        // Block division by zero (matches Python ValueError)
        if (/\/\s*0(\.0+)?(?!\d)/.test(mathExpr)) {
          current = "Error";
          expression = "";
          updateScreen();
          return;
        }

        mathExpr = mathExpr.replace(/\^/g, "**");
        const answer = Function('"use strict"; return (' + mathExpr + ")")();

        if (!isFinite(answer)) {
          current = "Error";
        } else {
          const rounded = Math.round(answer * 100000000) / 100000000;
          addToHistory(mathExpr.replace(/\*\*/g, "^"), rounded);
          current = String(rounded);
        }
        expression = "";
      } catch (e) {
        current = "Error";
        expression = "";
      }
      updateScreen();
    }

    function handleClick(label) {
      if (label === "C") return clearAll();
      if (label === "⌫") return deleteLast();
      if (label === "=") return calculate();
      if (label === "√") return applySqrt();
      if (["+", "-", "*", "/", "^"].includes(label)) return setOperator(label);
      appendValue(label);
    }

    buttons.forEach((label) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (["+", "-", "*", "/", "^", "√"].includes(label)) btn.className = "op";
      if (label === "=") btn.className = "equals";
      btn.addEventListener("click", () => handleClick(label));
      keysEl.appendChild(btn);
    });

    updateScreen();
  </script>
</body>
</html>
