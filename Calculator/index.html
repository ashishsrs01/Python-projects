<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Calculator | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 60px 16px 24px;
      font-family: "Segoe UI", system-ui, sans-serif;
      background: #0a1020;
      color: #eef4ff;
    }

    .calc {
      width: min(360px, 100%);
      border-radius: 18px;
      border: 1px solid rgba(120, 170, 255, 0.2);
      background: rgba(14, 20, 40, 0.9);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.35);
      overflow: hidden;
    }

    .screen {
      padding: 20px;
      text-align: right;
      background: rgba(0, 0, 0, 0.25);
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .expr {
      min-height: 22px;
      font-size: 0.9rem;
      color: rgba(200, 215, 240, 0.55);
      word-break: break-all;
    }

    .result {
      font-size: 2rem;
      font-weight: 700;
      margin-top: 6px;
      word-break: break-all;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      padding: 14px;
    }

    button {
      padding: 16px 8px;
      font-size: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.05);
      color: inherit;
      cursor: pointer;
    }

    button:hover { background: rgba(59, 158, 255, 0.15); }
    button.op { color: #7dd3fc; }
    button.wide { grid-column: span 2; }
    button.equals {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      border: none;
      font-weight: 700;
    }

    .history {
      max-height: 100px;
      overflow-y: auto;
      padding: 10px 16px 14px;
      font-size: 0.8rem;
      color: rgba(200, 215, 240, 0.6);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
    }

    .history div { margin-bottom: 4px; }
  </style>
</head>
<body>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="calc">
    <div class="screen">
      <div class="expr" id="expr"></div>
      <div class="result" id="result">0</div>
    </div>

    <div class="keys" id="keys"></div>
    <div class="history" id="history"></div>
  </div>

  <script>
    // Simple calculator — same idea as Calculator.py but in the browser
    let current = "0";
    let expression = "";
    let historyList = [];

    const exprEl = document.getElementById("expr");
    const resultEl = document.getElementById("result");
    const historyEl = document.getElementById("history");
    const keysEl = document.getElementById("keys");

    const buttons = [
      "C", "⌫", "√", "/",
      "7", "8", "9", "*",
      "4", "5", "6", "-",
      "1", "2", "3", "+",
      "0", ".", "^", "=",
    ];

  function updateScreen() {
      exprEl.textContent = expression;
      resultEl.textContent = current;
    }

    function addToHistory(expr, res) {
      historyList.unshift(expr + " = " + res);
      if (historyList.length > 5) historyList.pop();
      historyEl.innerHTML = historyList.map((line) => "<div>" + line + "</div>").join("");
    }

    function clearAll() {
      current = "0";
      expression = "";
      updateScreen();
    }

    function deleteLast() {
      if (current.length <= 1) {
        current = "0";
      } else {
        current = current.slice(0, -1);
      }
      updateScreen();
    }

    function appendValue(val) {
      if (current === "0" && val !== ".") {
        current = val;
      } else {
        current += val;
      }
      updateScreen();
    }

    function setOperator(op) {
      expression = current + " " + op;
      current = "0";
      updateScreen();
    }

    function calculate() {
      try {
        let mathExpr = expression + current;
        mathExpr = mathExpr.replace(/÷/g, "/").replace(/×/g, "*");

        // square root: turn "5 √" style into sqrt
        if (mathExpr.includes("√")) {
          const parts = mathExpr.split("√");
          const num = parseFloat(parts[parts.length - 1].trim());
          const answer = Math.sqrt(num);
          addToHistory("√" + num, answer);
          current = String(answer);
          expression = "";
          updateScreen();
          return;
        }

        // power: replace ^ with **
        mathExpr = mathExpr.replace(/\^/g, "**");
        const answer = Function('"use strict"; return (' + mathExpr + ")")();

        if (!isFinite(answer)) {
          current = "Error";
        } else {
          addToHistory(mathExpr.replace(/\*\*/g, "^"), answer);
          current = String(Math.round(answer * 100000000) / 100000000);
        }
        expression = "";
      } catch (e) {
        current = "Error";
      }
      updateScreen();
    }

    function handleClick(label) {
      if (label === "C") return clearAll();
      if (label === "⌫") return deleteLast();
      if (label === "=") return calculate();
      if (label === "√") {
        expression = current + " √";
        current = "0";
        updateScreen();
        return;
      }
      if (["+", "-", "*", "/", "^"].includes(label)) return setOperator(label);
      appendValue(label);
    }

    buttons.forEach((label) => {
      const btn = document.createElement("button");
      btn.textContent = label;
      if (["+", "-", "*", "/", "^", "√"].includes(label)) btn.className = "op";
      if (label === "=") btn.className = "equals";
      btn.addEventListener("click", () => handleClick(label));
      keysEl.appendChild(btn);
    });

    updateScreen();
  </script>
</body>
</html>
