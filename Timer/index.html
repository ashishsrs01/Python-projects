<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countdown Timer | Python Projects</title>
  <link rel="stylesheet" href="../shared/app.css" />
  <link rel="stylesheet" href="../shared/app-theme.css" />
  <style>
    .timer-container { text-align: center; }

    .ring-container {
      position: relative;
      width: 260px; height: 260px;
      margin: 0 auto 36px;
      animation: fade-up 0.55s ease 0.1s both;
    }

    .ring-svg { width: 100%; height: 100%; transform: rotate(-90deg); }

    .ring-bg {
      fill: none;
      stroke: rgba(52, 211, 153, 0.1);
      stroke-width: 6;
    }

    .ring-progress {
      fill: none;
      stroke: url(#ring-gradient);
      stroke-width: 6;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.5s ease;
    }

    .ring-display {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    .ring-time {
      font-size: 3.2rem;
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .ring-label {
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: var(--muted);
      margin-top: 6px;
    }

    .ring-container.alarm .ring-time {
      animation: alarm-pulse 0.5s ease-in-out infinite alternate;
      color: #fbbf24;
    }

    @keyframes alarm-pulse {
      from { transform: scale(1); }
      to { transform: scale(1.04); }
    }

    .ring-container.alarm .ring-progress { stroke: #fbbf24; }

    .input-section {
      display: flex; justify-content: center; gap: 16px;
      margin-bottom: 24px; flex-wrap: wrap;
      animation: fade-up 0.55s ease 0.14s both;
    }

    .input-group { display: flex; flex-direction: column; gap: 6px; align-items: center; }

    .input-label {
      font-size: 0.72rem; font-weight: 600;
      text-transform: uppercase; letter-spacing: 0.1em;
      color: var(--muted);
    }

    .time-input {
      width: 88px;
      padding: 12px;
      font-size: 1.3rem;
      font-weight: 600;
      text-align: center;
    }

    .time-input::-webkit-inner-spin-button,
    .time-input::-webkit-outer-spin-button { -webkit-appearance: none; }

    .presets {
      display: flex; justify-content: center; gap: 8px;
      margin-bottom: 24px; flex-wrap: wrap;
    }

    .controls {
      display: flex; justify-content: center; gap: 12px;
      animation: fade-up 0.55s ease 0.18s both;
    }

    .btn-hidden { display: none; }

    @media (max-width: 500px) {
      .ring-container { width: 210px; height: 210px; }
      .ring-time { font-size: 2.4rem; }
    }
  </style>
</head>
<body class="app-page" data-accent="emerald">
  <div class="bg-glow"></div>
  <a class="back-link" href="../index.html">← Back to Hub</a>

  <div class="app-shell">
    <header class="app-header">
      <h1 class="app-title">Countdown Timer</h1>
      <p class="app-subtitle">Set your time and watch it count down</p>
    </header>

    <div class="timer-container">
      <div class="ring-container" id="ring-container">
        <svg class="ring-svg" viewBox="0 0 280 280">
          <defs>
            <linearGradient id="ring-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" style="stop-color:#34d399" />
              <stop offset="100%" style="stop-color:#38bdf8" />
            </linearGradient>
          </defs>
          <circle class="ring-bg" cx="140" cy="140" r="126" />
          <circle class="ring-progress" id="ring-progress" cx="140" cy="140" r="126"
            stroke-dasharray="791.68" stroke-dashoffset="0" />
        </svg>
        <div class="ring-display">
          <div class="ring-time" id="ring-time">00:00</div>
          <div class="ring-label" id="ring-label">Ready</div>
        </div>
      </div>

      <div class="input-section" id="input-section">
        <div class="input-group">
          <label class="input-label" for="input-min">Minutes</label>
          <input type="number" class="time-input text-input" id="input-min" value="0" min="0" max="99" />
        </div>
        <div class="input-group">
          <label class="input-label" for="input-sec">Seconds</label>
          <input type="number" class="time-input text-input" id="input-sec" value="30" min="0" max="59" />
        </div>
      </div>

      <div class="presets" id="presets">
        <button class="btn-secondary" onclick="setPreset(0, 30)">0:30</button>
        <button class="btn-secondary" onclick="setPreset(1, 0)">1:00</button>
        <button class="btn-secondary" onclick="setPreset(2, 0)">2:00</button>
        <button class="btn-secondary" onclick="setPreset(5, 0)">5:00</button>
        <button class="btn-secondary" onclick="setPreset(10, 0)">10:00</button>
      </div>

      <div class="controls">
        <button class="btn-primary" id="btn-start" onclick="startTimer()">Start</button>
        <button class="btn-secondary btn-hidden" id="btn-pause" onclick="pauseTimer()">Pause</button>
        <button class="btn-secondary btn-hidden" id="btn-reset" onclick="resetTimer()">Reset</button>
      </div>
    </div>
  </div>

  <footer class="page-footer">
    Built by <a href="https://github.com/ashishsrs01" target="_blank" rel="noopener">Ashish Sharma</a>
  </footer>

  <script>
    let totalSeconds = 0, remainingSeconds = 0, timerInterval = null, isPaused = false;

    const ringProgress = document.getElementById('ring-progress');
    const ringTime = document.getElementById('ring-time');
    const ringLabel = document.getElementById('ring-label');
    const ringContainer = document.getElementById('ring-container');
    const inputSection = document.getElementById('input-section');
    const presetsEl = document.getElementById('presets');
    const btnStart = document.getElementById('btn-start');
    const btnPause = document.getElementById('btn-pause');
    const btnReset = document.getElementById('btn-reset');
    const inputMin = document.getElementById('input-min');
    const inputSec = document.getElementById('input-sec');

    const CIRCUMFERENCE = 2 * Math.PI * 126;

    function playAlarm() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.frequency.value = 880;
        gain.gain.value = 0.15;
        osc.start();
        setTimeout(() => { osc.stop(); ctx.close(); }, 400);
      } catch (e) {
        /* silent fallback if audio blocked */
      }
    }

    function formatTime(secs) {
      const m = Math.floor(secs / 60);
      const s = secs % 60;
      return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
    }

    function updateRing() {
      const fraction = totalSeconds > 0 ? remainingSeconds / totalSeconds : 0;
      ringProgress.style.strokeDashoffset = CIRCUMFERENCE * (1 - fraction);
      ringTime.textContent = formatTime(remainingSeconds);
    }

    function setPreset(min, sec) {
      inputMin.value = min;
      inputSec.value = sec;
      remainingSeconds = min * 60 + sec;
      totalSeconds = remainingSeconds;
      updateRing();
    }

    function startTimer() {
      if (isPaused) {
        isPaused = false;
        btnPause.textContent = 'Pause';
        timerInterval = setInterval(tick, 1000);
        ringLabel.textContent = 'Running';
        return;
      }

      const mins = parseInt(inputMin.value, 10) || 0;
      const secs = parseInt(inputSec.value, 10) || 0;
      totalSeconds = mins * 60 + secs;
      remainingSeconds = totalSeconds;

      if (totalSeconds <= 0) return;

      ringContainer.classList.remove('alarm');
      updateRing();
      ringLabel.textContent = 'Running';

      inputSection.style.display = 'none';
      presetsEl.style.display = 'none';
      btnStart.classList.add('btn-hidden');
      btnPause.classList.remove('btn-hidden');
      btnReset.classList.remove('btn-hidden');

      timerInterval = setInterval(tick, 1000);
    }

    function tick() {
      remainingSeconds--;
      updateRing();

      if (remainingSeconds <= 0) {
        clearInterval(timerInterval);
        timerInterval = null;
        ringLabel.textContent = "Time's Up! ⏰";
        ringContainer.classList.add('alarm');
        btnPause.classList.add('btn-hidden');
        playAlarm();
      }
    }

    function pauseTimer() {
      if (isPaused) {
        startTimer();
      } else {
        isPaused = true;
        clearInterval(timerInterval);
        timerInterval = null;
        btnPause.textContent = 'Resume';
        ringLabel.textContent = 'Paused';
      }
    }

    function resetTimer() {
      clearInterval(timerInterval);
      timerInterval = null;
      isPaused = false;
      remainingSeconds = 0;
      totalSeconds = 0;

      ringContainer.classList.remove('alarm');
      ringProgress.style.strokeDashoffset = 0;
      ringTime.textContent = '00:00';
      ringLabel.textContent = 'Ready';

      inputSection.style.display = 'flex';
      presetsEl.style.display = 'flex';
      btnStart.classList.remove('btn-hidden');
      btnPause.classList.add('btn-hidden');
      btnPause.textContent = 'Pause';
      btnReset.classList.add('btn-hidden');
    }

    updateRing();
  </script>
</body>
</html>
